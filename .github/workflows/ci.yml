name: Secure MiniStack DevSecOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-and-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lambda dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/requirements.txt
          pip install bandit pip-audit

      - name: Python syntax check
        run: |
          python -m py_compile lambda/handler.py

      - name: Bandit security scan
        run: |
          bandit -r lambda/handler.py

      - name: Dependency vulnerability scan
        run: |
          pip-audit -r lambda/requirements.txt

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: |
          terraform -chdir=infrastructure/terraform fmt -check

      - name: Terraform validation
        run: |
          terraform -chdir=infrastructure/terraform init -backend=false
          terraform -chdir=infrastructure/terraform validate

      - name: Install Checkov
        run: |
          pip install checkov

      - name: Checkov IaC security scan
        run: |
          checkov -d infrastructure/terraform \
            --skip-check CKV_AWS_273,CKV_AWS_40,CKV_AWS_300,CKV2_AWS_62,CKV_AWS_144,CKV_AWS_18,CKV_AWS_145

      - name: Install CloudFormation linter
        run: |
          pip install cfn-lint

      - name: CloudFormation validation
        run: |
          cfn-lint infrastructure/cloudformation/template.yaml
